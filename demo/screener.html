<!doctype html>
<html lang="en" data-auth="required">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MarketFlow (demo) · Screener</title>
  <script src="boot.js"></script>
  <link rel="stylesheet" href="../assets/style.css" />
  <link rel="stylesheet" href="demo.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%236a47ff'/><path d='M9 21v-6M16 23v-9M23 20v-5' stroke='white' stroke-width='3' stroke-linecap='round'/></svg>" />
</head>
<body class="mf-app">
  <header id="mf-header"></header>
  <main class="mf-main">
    <h1>Screener</h1>

    <form class="filters-form" id="filters" aria-label="Screener filters" novalidate>
      <div class="field">
        <label for="f-sector">Sector</label>
        <select id="f-sector"></select>
      </div>
      <div class="field">
        <label for="f-pe">P/E max</label>
        <input id="f-pe" type="number" inputmode="decimal" step="any" min="0" placeholder="e.g. 10" />
      </div>
      <div class="field">
        <label for="f-mcap">Market cap min (VND bn)</label>
        <input id="f-mcap" type="number" inputmode="decimal" step="any" min="0" placeholder="e.g. 100000" />
      </div>
      <div class="field">
        <label for="f-pmin">%Chg min</label>
        <input id="f-pmin" type="number" inputmode="decimal" step="any" placeholder="e.g. -2" />
      </div>
      <div class="field">
        <label for="f-pmax">%Chg max</label>
        <input id="f-pmax" type="number" inputmode="decimal" step="any" placeholder="e.g. 5" />
      </div>
      <button class="mf-btn" type="reset" id="reset">Reset filters</button>
    </form>
    <p class="field-note" id="range-note" role="note" hidden>%Chg min is greater than %Chg max, so nothing can match.</p>

    <p class="count" data-testid="result-count">&nbsp;</p>

    <div class="mf-table-wrap" role="region" aria-label="Screener results, scrollable" tabindex="0">
      <table class="mf-table" id="results">
        <caption class="sr-only">Screener results</caption>
        <thead>
          <tr>
            <th scope="col" class="tk">Ticker</th>
            <th scope="col" class="num">Last</th>
            <th scope="col" class="num">%Chg</th>
            <th scope="col" class="num">P/E</th>
            <th scope="col" class="num">Mkt cap (VND bn)</th>
            <th scope="col" class="txt">Sector</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="empty" data-testid="empty-state" id="empty" hidden>No stocks match these filters.</p>
  </main>
  <footer class="mf-footer"><p class="disclaimer" data-testid="disclaimer">Simulated data for testing demos — not real prices, not investment advice.</p></footer>
  <script type="module" src="screener.js"></script>
</body>
</html>
