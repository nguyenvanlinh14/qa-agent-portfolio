<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Test Run · Linh.QA</title>
  <meta name="description" content="Playwright run dashboard: live while the tests run (npm run test:live), replay of the latest CI run on the site." />
  <script>
    try { const t = localStorage.getItem('linhqa-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="stylesheet" href="live.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237c5cff'/><path d='M9 17l5 5 9-11' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round'/></svg>" />
</head>
<body>
  <header class="top">
    <div class="wrap row">
      <a class="brand" href="../" data-testid="live-home">Linh<span>.</span>QA</a>
      <h1>Test run <span class="mode" data-testid="live-mode">connecting</span></h1>
      <div class="controls" data-testid="replay-controls" hidden>
        <label>Speed
          <select data-testid="replay-speed" aria-label="Replay speed">
            <option value="1">1×</option><option value="4" selected>4×</option><option value="16">16×</option><option value="max">Instant</option>
          </select>
        </label>
        <button type="button" data-testid="replay-restart">Replay</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <p class="source" data-testid="live-source"></p>

    <section class="progress-wrap" aria-label="Progress">
      <div class="progress" role="progressbar" aria-label="Tests finished" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" data-testid="live-progress">
        <span class="bar pass"></span><span class="bar flaky"></span><span class="bar fail"></span><span class="bar skip"></span>
      </div>
      <p class="progress-text"><b data-testid="live-done">0</b> / <span data-testid="live-total">0</span> tests · <span data-testid="live-elapsed">0.0 s</span> <span data-testid="live-eta"></span></p>
    </section>

    <section class="counters" aria-label="Results">
      <div class="counter pass"><b data-testid="count-passed">0</b><span>passed</span></div>
      <div class="counter fail"><b data-testid="count-failed">0</b><span>failed</span></div>
      <div class="counter flaky"><b data-testid="count-flaky">0</b><span>flaky</span></div>
      <div class="counter skip"><b data-testid="count-skipped">0</b><span>skipped</span></div>
      <div class="counter run"><b data-testid="count-running">0</b><span>running</span></div>
    </section>

    <section class="grid">
      <div class="panel">
        <h2>Browser <small data-testid="browser-test">last finished UI test</small></h2>
        <figure class="browser" data-testid="browser">
          <div class="chrome" aria-hidden="true"><i></i><i></i><i></i></div>
          <a class="url" data-testid="browser-url" target="_blank" rel="noopener">waiting for the first UI test…</a>
          <div class="screen"><img data-testid="browser-frame" alt="" hidden /><span class="status" data-testid="browser-status" hidden></span><p class="placeholder" data-testid="browser-empty">No screenshot yet.</p></div>
        </figure>
        <h2>Workers</h2>
        <ul class="workers" data-testid="workers" aria-live="off"></ul>
        <h2>Throughput <small>tests finished per second</small></h2>
        <svg class="spark" viewBox="0 0 300 60" preserveAspectRatio="none" data-testid="throughput" role="img" aria-label="Tests finished per second"><path class="area" /><path class="line" /></svg>
        <h2>By project</h2>
        <table class="projects" data-testid="projects"><thead><tr><th>Project</th><th>Passed</th><th>Failed</th><th>Flaky</th><th>Skipped</th></tr></thead><tbody></tbody></table>
      </div>
      <div class="panel">
        <h2>Failures</h2>
        <ol class="failures" data-testid="failures" aria-live="polite"></ol>
        <p class="empty" data-testid="no-failures">No failures.</p>
        <h2>Finished <small>latest first</small></h2>
        <ol class="finished" data-testid="finished"></ol>
      </div>
    </section>
  </main>
  <script type="module" src="live.js"></script>
</body>
</html>
