name: Update visual snapshots

# Regenerates the Linux baselines inside the same Playwright image CI uses,
# then commits them back to main. Run it manually after an intentional UI change.
on:
  workflow_dispatch:

concurrency:
  group: update-snapshots
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: Regenerate Linux baselines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Trust the workspace (container user differs from checkout owner)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - run: npm run build
      - name: Update screenshots
        run: npx playwright test --project=visual --update-snapshots=all
      - name: Commit and push changed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "test(visual): update Linux baselines"
            git push origin HEAD:main
          fi
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/visual/__screenshots__/
          retention-days: 14
          if-no-files-found: ignore
